url: https://mlr-org.github.io/celecx/

template:
  bootstrap: 5
  light-switch: true
  math-rendering: mathjax
  package: mlr3pkgdowntemplate

development:
  mode: unreleased
  version_label: default
  version_tooltip: "Version"

toc:
  depth: 3

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github, mattermost, rss, lightswitch]
  components:
    home: ~
    reference:
      icon: fa fa-file-alt
      text: Reference
      href: reference/index.html
    mattermost:
      icon: fa fa-comments
      href: https://lmmisld-lmu-stats-slds.srv.mwn.de/mlr_invite/
      aria-label: Mattermost chat
    rss:
      icon: fa-rss
      href: https://mlr-org.com/
      aria-label: RSS

reference:
  - title: Package
    contents:
      - celecx-package

  - title: Running Active Learning
    desc: High-level entry points that construct and run active-learning optimizers.
    contents:
      - optimize_active
      - optimizer_al
      - optimizer_pool_al

  - title: Search Instances
    desc: Instance, callback context, and termination condition of a search run.
    contents:
      - SearchInstance
      - ContextSearch
      - search_terminated_error

  - title: Optimizers
    desc: Optimizer base classes and concrete optimizers over search spaces or candidate pools.
    contents:
      - OptimizerSearchAbstract
      - OptimizerPoolAbstract
      - OptimizerAL
      - starts_with("mlr_optimizers_")

  - title: Active Learning Proposers
    desc: Proposers that build active-learning batches inside OptimizerAL, and the context they operate on.
    contents:
      - ALContext
      - ALProposer
      - ALProposerScoreAbstract
      - ALProposerScore
      - ALProposerSequentialScore
      - ALProposerSequentialReference
      - ALProposerPseudoLabel
      - ALProposerPortfolio

  - title: Score Modifiers
    desc: Modifiers that adjust acquisition scores during sequential batch construction.
    contents:
      - starts_with("ALScoreModifier")

  - title: Acquisition Functions
    desc: Active-learning acquisition functions, registered in mlr3mbo's dictionary.
    contents:
      - starts_with("AcqFunction")

  - title: Active Learning Distances
    desc: Distance objects, their dictionary, and sugar constructors.
    contents:
      - ALDistance
      - ALDistanceGeometry
      - mlr_al_distances
      - starts_with("mlr_al_distances_")
      - clx_ald
      - clx_alds

  - title: Space Samplers
    desc: Space-filling and pool-based samplers, their dictionary, and sugar constructors.
    contents:
      - SpaceSampler
      - SpaceSamplerDistance
      - mlr_space_samplers
      - starts_with("mlr_space_samplers_")
      - clx_sps
      - clx_spss

  - title: Objectives
    desc: Objectives evaluated by table lookup or fitted learners, and pool-restricted objective wrappers.
    contents:
      - ObjectiveDataset
      - ObjectiveLearner
      - ObjectivePoolAbstract
      - ObjectivePoolRFun
      - ObjectivePoolWrapper

  - title: Surrogate Regression Learners
    desc: Regression learners and wrappers with uncertainty quantification.
    contents:
      - starts_with("mlr_learners_regr.")

  - title: Recording Learning Curves
    desc: Turning a run into a learning-curve task, online via callback or offline by replay.
    contents:
      - celecx.surrogate_performance
      - replay_surrogate_performance
      - replay_surrogate_perf_table
      - task_lce_from_perf
      - task_lce_best_so_far
      - TaskLCE
      - lce_link

  - title: Learning-Curve Extrapolation
    desc: Learners that extrapolate learning curves, and their prediction object.
    contents:
      - LearnerLCE
      - starts_with("mlr_learners_lce.")
      - PredictionLCE

  - title: Evaluating Extrapolators
    desc: Measures and resampling schemes for learning-curve tasks.
    contents:
      - MeasureLCE
      - mlr_measures_lce
      - mlr_measures_lce_distributional
      - mlr_resamplings_lce.expanding_cv

  - title: Batches-to-Target Forecasts
    contents:
      - lce_batches_to_target

  - title: Design Generation
    contents:
      - generate_design_grid_celecx

  - title: Base Classes
    desc: Shared abstractions.
    contents:
      - ConfigurableComponent
      - SurrogateNull
      - ResultAssignerNull
